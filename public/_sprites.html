<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sprites — revisión</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #07080f; color: #f2f2f5; font-family: "Press Start 2P", monospace; padding: 24px 16px; }
    h1 { font-size: 14px; color: #e3b341; text-align: center; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 6px; background: #0d0f1c; border: 1px solid rgba(255,255,255,.1); }
    canvas { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .cell small { font-size: 8px; line-height: 1.5; text-align: center; color: #a3a6b8; }
    .cell.bad small { color: #ce1126; }
    #status { text-align: center; font-size: 8px; color: #a3a6b8; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>RETRATOS 32x32 — 26 PERSONAJES</h1>
  <div class="grid" id="grid"></div>
  <p id="status"></p>
  <script src="sprites.js"></script>
  <script>
    (function () {
      var grid = document.getElementById("grid");
      var slugs = Object.keys(window.MD_SPRITES);
      var bad = 0;
      slugs.forEach(function (slug) {
        var cell = document.createElement("div");
        cell.className = "cell";
        var cv = document.createElement("canvas");
        var ok = window.MD_drawSprite(slug, cv);
        if (!ok) { bad++; cell.classList.add("bad"); }
        var label = document.createElement("small");
        label.textContent = window.MD_SPRITES[slug].name + (ok ? "" : " (!)");
        cell.appendChild(cv);
        cell.appendChild(label);
        grid.appendChild(cell);
      });
      document.getElementById("status").textContent = slugs.length + " sprites · " + bad + " con warnings";
    })();
  </script>
</body>
</html>
