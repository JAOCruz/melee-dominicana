<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¡Recibido! — Melee Dominicana</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .done { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
    .done h1 { font-family: var(--pixel); font-size: clamp(22px, 5vw, 40px); line-height: 1.4; margin: 0 0 16px; text-shadow: 4px 4px 0 var(--blue); }
    .done p { color: var(--muted); max-width: 440px; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <main class="done">
    <div>
      <h1>¡Recibido! <span class="gold">GG</span></h1>
      <p>Revisamos todo lo que nos mandan. Si tu clip, set o stream entra, sale en el canal y en el sitio con tu nombre.</p>
      <a class="btn btn-gold" href="/#envia">Mandar otro</a>
      <a class="btn btn-ghost" href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
